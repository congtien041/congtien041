<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Jump - Arcade Leaderboard</title>
    <!-- Tải thư viện Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 15px;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }
        .container {
            display: flex;
            gap: 30px;
            max-width: 1000px;
            width: 100%;
            padding: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        /* Game Screen */
        .game-box {
            position: relative;
            background: #121824;
            border: 3px solid #00ffff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #131a2c, #0a0d1a);
        }
        /* Leaderboard Screen */
        .leaderboard-box {
            background: #121824;
            border: 3px solid #ff0055;
            border-radius: 8px;
            padding: 20px;
            min-width: 320px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.2);
            flex: 1;
        }
        .leaderboard-box h2 {
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
            text-align: center;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #1f293d;
        }
        th { color: #8f9cae; font-weight: 600; }
        tr:nth-child(-n+3) td:nth-child(1) {
            color: #ff0055;
            font-weight: bold;
            text-shadow: 0 0 5px #ff0055;
        }
        tr:hover { background-color: #1a233d; }
        /* Overlay UI */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .btn {
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 10px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,255,255,0.3);
            margin-top: 15px;
            text-transform: uppercase;
        }
        .btn:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 20px #00ffff;
        }
        input[type="text"] {
            background: #1a233d;
            border: 2px solid #ff0055;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-size: 1.1rem;
            outline: none;
            margin-top: 10px;
            width: 80%;
        }
        .instruction {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #5f7597;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>🕹️ NEON SPACE RUNNER 🕹️</h1>
    
    <div class="container">
        <!-- GAME FRAME -->
        <div class="game-box">
            <canvas id="gameCanvas" width="550" height="350"></canvas>
            
            <!-- START / GAME OVER SCREENS -->
            <div id="gameUI" class="overlay">
                <h2 id="uiTitle" style="color: #00ffff; text-shadow: 0 0 10px #00ffff; font-size: 2rem;">READY PLAYER ONE</h2>
                <p id="uiScore" style="margin-top: 5px; color: #a4b3c6;"></p>
                <input type="text" id="playerName" placeholder="Nhập tên của bạn (Tối đa 10 kí tự)" maxlength="10" />
                <button id="actionBtn" class="btn">Bắt đầu</button>
            </div>
        </div>

        <!-- LEADERBOARD FRAME -->
        <div class="leaderboard-box">
            <h2>🏆 TOP 10 CAO THỦ</h2>
            <table>
                <thead>
                    <tr>
                        <th style="width: 20%">Hạng</th>
                        <th style="width: 50%">Tên</th>
                        <th style="width: 30%">Điểm</th>
                    </tr>
                </thead>
                <tbody id="leaderboardData">
                    <tr><td colspan="3" style="text-align:center; color:#5f7597;">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <p class="instruction">Điều khiển: Nhấn phím <b>SPACE</b> hoặc chạm vào màn hình để Nhảy.</p>

    <script>
        // === CẤU HÌNH SUPABASE ===
        const SUPABASE_URL = 'https://gxzvsjwgosbfpxcuorft.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_brHIVAgGl-G-qEF7aVoojA_lRdf2ggK';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // DOM Elements
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameUI = document.getElementById('gameUI');
        const uiTitle = document.getElementById('uiTitle');
        const uiScore = document.getElementById('uiScore');
        const playerNameInput = document.getElementById('playerName');
        const actionBtn = document.getElementById('actionBtn');
        const leaderboardData = document.getElementById('leaderboardData');

        // Game State Variables
        let isPlaying = false;
        let score = 0;
        let animationFrameId;
        
        // Physics & Entities
        const gravity = 0.6;
        let player = {
            x: 50, y: 250, size: 30,
            vy: 0, jumpForce: -12,
            grounded: false,
            color: '#00ffff'
        };
        let obstacles = [];
        let spawnTimer = 0;
        let gameSpeed = 5;

        // Fetch Leaderboard From Supabase
        async function updateLeaderboardTable() {
            try {
                let { data, error } = await supabase
                    .from('leaderboard')
                    .select('player_name, score')
                    .order('score', { ascending: false })
                    .limit(10);
                
                if (error) throw error;
                
                leaderboardData.innerHTML = '';
                if(data.length === 0) {
                    leaderboardData.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#5f7597;">Chưa có thành tích. Hãy là người đầu tiên!</td></tr>`;
                    return;
                }
                
                data.forEach((row, index) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>#${index + 1}</td>
                        <td>${escapeHTML(row.player_name)}</td>
                        <td style="color:#00ffff; font-weight:bold;">${row.score}</td>
                    `;
                    leaderboardData.appendChild(tr);
                });
            } catch (err) {
                console.error("Error fetching leaderboard:", err);
                leaderboardData.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#ff0055;">Lỗi kết nối database!</td></tr>`;
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Handle Input
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });

        function jump() {
            if (player.grounded && isPlaying) {
                player.vy = player.jumpForce;
                player.grounded = false;
            }
        }

        // Initialize / Restart Game Loop
        function startGame() {
            obstacles = [];
            score = 0;
            gameSpeed = 5;
            spawnTimer = 0;
            player.y = 250;
            player.vy = 0;
            isPlaying = true;
            gameUI.style.display = 'none';
            gameLoop();
        }

        // Main Loop
        function gameLoop() {
            if (!isPlaying) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Ground
            ctx.strokeStyle = '#1f293d';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 300);
            ctx.lineTo(canvas.width, 300);
            ctx.stroke();

            // Handle Player Mechanics
            player.vy += gravity;
            player.y += player.vy;
            
            if (player.y + player.size >= 300) {
                player.y = 300 - player.size;
                player.vy = 0;
                player.grounded = true;
            }

            // Draw Player with Neon Shadow
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fillRect(player.x, player.y, player.size, player.size);
            ctx.shadowBlur = 0; // reset

            // Handle Obstacles
            spawnTimer++;
            if (spawnTimer > Math.max(50, 100 - gameSpeed * 2)) {
                let height = Math.random() * 40 + 20;
                obstacles.push({
                    x: canvas.width,
                    y: 300 - height,
                    width: 20,
                    height: height,
                    color: '#ff0055'
                });
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                // Draw Obstacle
                ctx.fillStyle = obs.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.shadowBlur = 0;

                // Collision Detection (AABB)
                if (player.x < obs.x + obs.width &&
                    player.x + player.size > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.size > obs.y) {
                    gameOver();
                    return;
                }

                // Score Check
                if (obs.x + obs.width < player.x && !obs.passed) {
                    score += 10;
                    obs.passed = true;
                    gameSpeed += 0.2; // Increase difficulty dynamically
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // UI Score Tracker
            ctx.fillStyle = '#ffffff';
            ctx.font = '20px Arial';
            ctx.fillText(`SCORE: ${score}`, 20, 35);

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        async function gameOver() {
            isPlaying = false;
            cancelAnimationFrame(animationFrameId);
            
            uiTitle.innerText = "GAME OVER";
            uiTitle.style.color = "#ff0055";
            uiTitle.style.textShadow = "0 0 10px #ff0055";
            uiScore.innerText = `Điểm của bạn: ${score}`;
            playerNameInput.style.display = 'block';
            actionBtn.innerText = "Nộp điểm & Chơi lại";
            gameUI.style.display = 'flex';
        }

        // Handle Button Event
        actionBtn.addEventListener('click', async () => {
            if (actionBtn.innerText.includes("Nộp điểm")) {
                const name = playerNameInput.value.trim() || "Anonymous";
                actionBtn.innerText = "Đang lưu...";
                actionBtn.disabled = true;

                // Insert into Supabase
                try {
                    const { error } = await supabase
                        .from('leaderboard')
                        .insert([{ player_name: name, score: score }]);
                    
                    if (error) throw error;
                } catch (err) {
                    console.error("Lỗi khi upload dữ liệu: ", err);
                }

                await updateLeaderboardTable();
                actionBtn.disabled = false;
                playerNameInput.style.display = 'none';
                startGame();
            } else {
                playerNameInput.style.display = 'none';
                startGame();
            }
        });

        // Load ban đầu
        playerNameInput.style.display = 'none';
        updateLeaderboardTable();
    </script>
</body>
</html>
